name: Vorschau deployen (GitHub Pages)

on:
  push:
    branches: ["claude/session-eo19wu"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pages konfigurieren (aktiviert Pages bei Bedarf)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
